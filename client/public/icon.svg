<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#blueGrad)"/>
  <circle cx="256" cy="256" r="180" stroke="white" stroke-width="8" stroke-dasharray="16 16" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" stroke="white" stroke-width="12" fill="none" opacity="0.45"/>
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Center Pad -->
    <ellipse cx="256" cy="310" rx="70" ry="55"/>
    <!-- Top Toes -->
    <circle cx="160" cy="205" r="32"/>
    <circle cx="225" cy="165" r="34"/>
    <circle cx="287" cy="165" r="34"/>
    <circle cx="352" cy="205" r="32"/>
  </g>
</svg>
